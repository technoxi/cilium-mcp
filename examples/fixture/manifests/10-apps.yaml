---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: cilium-mcp-lab
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: hashicorp/http-echo:1.0
        args: ["-text=db-ok", "-listen=:5432"]
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: cilium-mcp-lab
  labels:
    app: db
spec:
  selector:
    app: db
  ports:
