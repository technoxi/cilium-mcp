# storefront namespace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: storefront
  labels:
    app: web-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
      - name: curl
        image: curlimages/curl:8.7.1
        command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: storefront
  labels:
    app: catalog-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
      - name: app
        image: hashicorp/http-echo:1.0
        args: ["-text=catalog-ok", "-listen=:8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: storefront
spec:
  selector:
    app: catalog-api
  ports:
  - port: 8080
    targetPort: 8080
